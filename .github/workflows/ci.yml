name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report outdated dependencies
        run: npm outdated --workspaces
        continue-on-error: true

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint backend
        run: npm run lint:backend

      - name: Lint frontend
        run: npm run lint:frontend

      - name: Test backend
        run: npm run test:backend

      - name: Test frontend
        run: npm run test:frontend

      - name: Build backend Docker image
        run: docker build -f backend/Dockerfile -t task-manage-backend:ci .

      - name: Build frontend Docker image
        run: docker build -f frontend/Dockerfile --build-arg VITE_API_URL=http://localhost:5002/api -t task-manage-frontend:ci .

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Trigger backend and frontend deploys
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
          FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          commit_sha="$(git rev-parse HEAD)"
          curl --fail --silent --show-error --output /dev/null \
            --get --data-urlencode "ref=$commit_sha" "$BACKEND_HOOK"
          curl --fail --silent --show-error --output /dev/null \
            --get --data-urlencode "ref=$commit_sha" "$FRONTEND_HOOK"